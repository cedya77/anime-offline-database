name: Split request
description: Entries have been merged together although they should be separate entries?
title: "Split entries for <title>"
labels: [split-request]
assignees: cedya77
body:
- type: checkboxes
  id: background
  attributes:
    label: Have you read how merging works?
    description: Please read [merge-decisions/README.md](https://github.com/cedya77/anime-offline-database/blob/main/merge-decisions/README.md) first. It explains why entries get merged and what a merge lock does.
    options:
      - label: Yes, I have read it
        required: true
  validations:
    required: true
- type: textarea
  id: original
  attributes:
    label: Original entry
    description: Which entry should be split? Paste the content of the `sources` property of the entry as it currently appears in the dataset.
  validations:
    required: true
- type: markdown
  attributes:
    value: |
      **Example:**
      ````
      ```
      "https://anidb.net/anime/9466",
      "https://anilist.co/anime/15809",
      "https://anime-planet.com/anime/the-devil-is-a-part-timer",
      "https://myanimelist.net/anime/15809",
      "https://anidb.net/anime/16104",
      "https://anilist.co/anime/130592",
      "https://anime-planet.com/anime/the-devil-is-a-part-timer-2",
      "https://myanimelist.net/anime/48413"
      ```
      ````
- type: textarea
  id: expected_entries
  attributes:
    label: How should it be split?
    description: List the entries you expect to see. Paste the URLs from the `sources` property and put each expected entry in its own block, enclosed in backticks (```).
  validations:
    required: true
- type: markdown
  attributes:
    value: |
      **Example:**
      ````
      ```
      "https://anidb.net/anime/9466",
      "https://anilist.co/anime/15809",
      "https://anime-planet.com/anime/the-devil-is-a-part-timer",
      "https://myanimelist.net/anime/15809"
      ```

      ```
      "https://anidb.net/anime/16104",
      "https://anilist.co/anime/130592",
      "https://anime-planet.com/anime/the-devil-is-a-part-timer-2",
      "https://myanimelist.net/anime/48413"
      ```
      ````
- type: textarea
  id: reason
  attributes:
    label: Additional reasoning
    description: Why should these be separate entries? References to titles, episode counts or air dates make it much faster to confirm.
  validations:
    required: false
