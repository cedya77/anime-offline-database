name: Housekeeping

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Workflow housekeeping
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 30
          keep_minimum_runs: 1

      - id: fetch-latest-release
        name: Fetch the release which has aged out
        run: |
          # `latest` is a moving pointer at the newest build, so it is never a pruning candidate,
          # and the five most recent weeks stay served. Empty output skips the deletion entirely.
          version=$(git tag --sort=creatordate | grep -v '^latest$' | head -n -5 | tail -1)
          echo "PREVIOUS_VERSION=$version" >> $GITHUB_OUTPUT

      - name: Delete outdated release assets
        if: steps.fetch-latest-release.outputs.PREVIOUS_VERSION != ''
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.fetch-latest-release.outputs.PREVIOUS_VERSION }}
          assets: |
            *.json
            *.jsonl 
            *.zst
          fail-if-no-release: false
          fail-if-no-assets: false
